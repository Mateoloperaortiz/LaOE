name: CI

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  INTEGRATION_WORKERS: "2"
  DATABASE_URL: postgresql://casa:casa@127.0.0.1:5433/casa_digital
  APP_URL: http://localhost:3000
  APP_TIMEZONE: America/Bogota
  TZ: UTC
  SESSION_SECRET: ci-secreto-de-sesion-que-no-es-real-0000000000000000
  INSTITUTIONAL_EMAIL_DOMAINS: eafit.edu.co
  OTP_FIXED_CODE: "123456"
  EMAIL_FROM: "OE EAFIT <noreply@localhost>"
  MAILER: console
  S3_ENDPOINT: http://127.0.0.1:3900
  S3_REGION: garage
  S3_BUCKET: media
  S3_ACCESS_KEY_ID: GK0c1a5ad191ta1de5a2r0110000dev0
  S3_SECRET_ACCESS_KEY: 9b3f0e6d2c1a4f8e7d6c5b4a3928170f6e5d4c3b2a190807f6e5d4c3b2a19080
  S3_FORCE_PATH_STYLE: "true"
  JOBS_ENABLED: "false"

jobs:
  cambios:
    name: Clasificar cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ADR-054: lista ejecuciones y descarga el ci-result de main para reutilizarlo al promover.
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: scope
        run: node scripts/ci/run.mjs classify
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.scope.outputs.mode == 'promotion'
        with:
          name: ci-promotion
          path: ci-results/promotion.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.scope.outputs.mode == 'reuse'
        with:
          name: ci-reuse
          path: ci-results/reuse.json
          if-no-files-found: error
          retention-days: 14

  # ADR-152: calidad en paralelo y runners hospedados tras publicar el repositorio.
  estatica:
    name: Biome · tsc · dependency-cruiser · knip
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deps:check
      - run: npm run deadcode

  unitarias:
    name: unit · extractor
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p ci-results
      - run: npm test -- --reporter=default --reporter=json --outputFile=ci-results/unit.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: uv para el extractor de normativa
        run: python -m pip install uv
      - run: npm run test:extractor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-unit
          path: ci-results/unit.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: build · inventario E2E
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p ci-results
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-node24-next-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-node24-next-quality-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-
      - run: npm run build
        env:
          NODE_ENV: production
          OTP_FIXED_CODE: ""
      - name: Inventario completo de E2E, sin crear base ni arrancar servidor
        run: npm run test:e2e -- --list --reporter=json
        env:
          DATABASE_URL: postgresql://casa:casa@127.0.0.1:5433/casa_digital
          PLAYWRIGHT_JSON_OUTPUT_FILE: ci-results/inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-inventory
          path: ci-results/inventory.json
          if-no-files-found: error
          retention-days: 14

  respaldo:
    name: respaldo · retención · concurrencia · restauración
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Imagen y recuperación con datos sintéticos aislados
        shell: bash
        run: |
          bash -n scripts/backup.sh tests/backup/run.sh
          bash tests/backup/run.sh 2>&1 | tee "$RUNNER_TEMP/backup-test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-backup
          path: ${{ runner.temp }}/backup-test.log
          retention-days: 7

  integracion:
    name: integración ${{ matrix.shard }}/3
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa_digital
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U casa -d casa_digital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Conectar la base sintética de esta partición
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          [[ "$PGPORT" =~ ^[0-9]+$ ]]
          echo "DATABASE_URL=postgresql://casa:casa@127.0.0.1:$PGPORT/casa_digital" >> "$GITHUB_ENV"
      - name: Garage (bucket S3 local)
        run: |
          garage="laoe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SHARD}"
          echo "GARAGE_CONTAINER=$garage" >> "$GITHUB_ENV"
          docker run -d --name "$garage" --label "laoe-ci.run=$GITHUB_RUN_ID" \
            -p 127.0.0.1::3900 \
            -v "$PWD/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$S3_BUCKET" \
            dxflrs/garage:v2.3.0 /garage server --single-node --default-bucket
          port=$(docker port "$garage" 3900/tcp | head -1 | awk -F: '{print $NF}')
          [[ "$port" =~ ^[0-9]+$ ]]
          echo "S3_ENDPOINT=http://127.0.0.1:$port" >> "$GITHUB_ENV"
      - run: npm ci
      - run: mkdir -p ci-results
      - run: npm run storage:init
        timeout-minutes: 1
      - name: Diagnóstico de Garage si la preparación falla
        if: failure()
        run: docker logs --tail 100 "$GARAGE_CONTAINER"
      - id: particion
        name: Reparto balanceado de archivos por duración
        run: node scripts/ci/run.mjs integration-shard ${{ matrix.shard }}/3
      # global-setup crea y migra su base _test en cada runner; E2E prepara otra en los suyos.
      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile=ci-results/integration-${{ matrix.shard }}.json ${{ steps.particion.outputs.files }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-integration-${{ matrix.shard }}
          path: ci-results/integration-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Limpiar únicamente el Garage de esta partición
        if: always()
        run: |
          if [[ -n "${GARAGE_CONTAINER:-}" ]] && [[ "$(docker inspect --format '{{ index .Config.Labels "laoe-ci.run" }}' "$GARAGE_CONTAINER" 2>/dev/null)" == "$GITHUB_RUN_ID" ]]; then
            docker rm -fv "$GARAGE_CONTAINER"
          fi

  e2e:
    name: E2E ${{ matrix.shard }}/6
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa_digital
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U casa -d casa_digital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHARD: ${{ matrix.shard }}
      E2E_PORT: "3000"
      PLAYWRIGHT_JSON_OUTPUT_FILE: ci-results/e2e-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Conectar la base sintética de esta partición
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          [[ "$PGPORT" =~ ^[0-9]+$ ]]
          echo "DATABASE_URL=postgresql://casa:casa@127.0.0.1:$PGPORT/casa_digital" >> "$GITHUB_ENV"
      - name: Puerto local libre para el servidor E2E
        run: |
          port=$(node -e 'const s=require("node:net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')
          echo "E2E_PORT=$port" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
      - name: Garage (bucket S3 propio de la partición)
        run: |
          garage="laoe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SHARD}"
          echo "GARAGE_CONTAINER=$garage" >> "$GITHUB_ENV"
          docker run -d --name "$garage" --label "laoe-ci.run=$GITHUB_RUN_ID" \
            -p 127.0.0.1::3900 \
            -v "$PWD/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$S3_BUCKET" \
            dxflrs/garage:v2.3.0 /garage server --single-node --default-bucket
          port=$(docker port "$garage" 3900/tcp | head -1 | awk -F: '{print $NF}')
          [[ "$port" =~ ^[0-9]+$ ]]
          echo "S3_ENDPOINT=http://127.0.0.1:$port" >> "$GITHUB_ENV"
      - run: npm ci
      - run: mkdir -p ci-results
      - run: npm run storage:init
        timeout-minutes: 1
      - name: Diagnóstico de Garage si la preparación falla
        if: failure()
        run: docker logs --tail 100 "$GARAGE_CONTAINER"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-e2e-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-node24-next-e2e-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-
      - name: Build de producción para e2e
        run: npm run build
        env:
          NODE_ENV: production
          OTP_FIXED_CODE: ""
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-node24-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-playwright-
      - run: npx playwright install --with-deps chromium
      - id: particion
        name: Reparto balanceado de escenarios por duración
        run: node scripts/ci/run.mjs e2e-shard ${{ matrix.shard }}/6
      - run: npm run test:e2e -- --workers=1 --forbid-only --reporter=github,json
        env:
          E2E_FILES: ${{ steps.particion.outputs.files }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-e2e-${{ matrix.shard }}
          path: ci-results/e2e-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Limpiar únicamente el Garage de esta partición
        if: always()
        run: |
          if [[ -n "${GARAGE_CONTAINER:-}" ]] && [[ "$(docker inspect --format '{{ index .Config.Labels "laoe-ci.run" }}' "$GARAGE_CONTAINER" 2>/dev/null)" == "$GITHUB_RUN_ID" ]]; then
            docker rm -fv "$GARAGE_CONTAINER"
          fi

  # ADR-141: la imagen de despliegue se construye y se prueba que arranca en cada CI completo;
  # publicarla y desplegarla es del workflow de despliegue, tras la puerta.
  imagen:
    name: imagen · arranque
    needs: cambios
    if: github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.cambios.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa_digital
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U casa -d casa_digital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Identificar recursos de esta prueba de imagen
        run: |
          echo "CI_IMAGE=laoe-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "CI_WEB=laoe-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Contexto de imagen con los permisos versionados en Git
        run: |
          context=$(mktemp -d "$RUNNER_TEMP/laoe-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")
          echo "CI_BUILD_CONTEXT=$context" >> "$GITHUB_ENV"
          # El padre privado conserva la umask del runner. Solo el árbol de Git
          # recupera modos 644/755; no se incluyen .git ni archivos sin versionar.
          git -c tar.umask=0022 archive --format=tar HEAD | tar --extract --same-permissions --no-same-owner --directory="$context"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.CI_BUILD_CONTEXT }}
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=imagen
          cache-to: type=gha,mode=max,scope=imagen
      - name: Migrar con el release de la imagen y arrancar el servidor
        env:
          DATABASE_URL: postgresql://casa:casa@postgres:5432/casa_digital
          CI_NETWORK: ${{ job.services.postgres.network }}
        run: |
          probe() {
            docker run --rm --network "$CI_NETWORK" \
              -e DATABASE_URL -e SESSION_SECRET -e INSTITUTIONAL_EMAIL_DOMAINS \
              -e APP_URL=http://127.0.0.1:8080 -e APP_TIMEZONE -e TZ -e EMAIL_FROM \
              -e MAILER -e JOBS_ENABLED -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET \
              -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e S3_FORCE_PATH_STYLE "$@"
          }
          probe "$CI_IMAGE" node db-release.mjs
          docker run -d --name "$CI_WEB" --network "$CI_NETWORK" \
            --label "laoe-ci.run=$GITHUB_RUN_ID" \
            -p 127.0.0.1::8080 \
            -e DATABASE_URL -e SESSION_SECRET -e INSTITUTIONAL_EMAIL_DOMAINS \
            -e APP_URL=http://127.0.0.1:8080 -e APP_TIMEZONE -e TZ -e EMAIL_FROM \
            -e MAILER -e JOBS_ENABLED -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET \
            -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e S3_FORCE_PATH_STYLE \
            "$CI_IMAGE"
          port=$(docker port "$CI_WEB" 8080/tcp | head -1 | awk -F: '{print $NF}')
          [[ "$port" =~ ^[0-9]+$ ]]
          health="$RUNNER_TEMP/health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -f "$health"
          for _attempt in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:$port/api/health" -o "$health"; then break; fi
            sleep 2
          done
          cat "$health"
          python3 - "$health" "$GITHUB_SHA" <<'CHECK'
          import json, sys
          with open(sys.argv[1]) as source:
              h = json.load(source)
          assert h['status'] == 'ok', h
          assert h['commit'] == sys.argv[2], h
          print('salud ok con el SHA horneado')
          CHECK
      - name: Registros y limpieza de los recursos de esta prueba
        if: always()
        run: |
          if [[ -n "${CI_WEB:-}" ]] && [[ "$(docker inspect --format '{{ index .Config.Labels "laoe-ci.run" }}' "$CI_WEB" 2>/dev/null)" == "$GITHUB_RUN_ID" ]]; then
            docker logs "$CI_WEB" 2>&1 | tail -50 || true
            docker rm -fv "$CI_WEB"
          fi
          if [[ -n "${CI_IMAGE:-}" ]]; then docker image rm "$CI_IMAGE" || true; fi
          if [[ "${CI_BUILD_CONTEXT:-}" == "$RUNNER_TEMP/laoe-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."* ]] && [[ -d "$CI_BUILD_CONTEXT" && ! -L "$CI_BUILD_CONTEXT" ]]; then
            rm -rf -- "$CI_BUILD_CONTEXT"
          fi

  resultado:
    name: CI
    if: always() && github.repository == 'Mateoloperaortiz/LaOE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [cambios, estatica, unitarias, build, imagen, respaldo, integracion, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.cambios.outputs.mode != 'documentation'
        with:
          pattern: ci-*
          path: ci-results
          merge-multiple: true
      - name: Exigir jobs aprobados, inventario completo y outbox sano
        if: always()
        run: node scripts/ci/run.mjs gate
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-result
          path: ci-results/ci-result.json
          if-no-files-found: error
          retention-days: 14
