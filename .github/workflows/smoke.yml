name: Smoke de Railway

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: ID del deployment exitoso publicado por Railway en GitHub
        required: true
        type: string

permissions:
  contents: read
  deployments: read

defaults:
  run:
    shell: bash

concurrency:
  group: smoke-${{ github.event.deployment.id || inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke del SHA desplegado
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'railway-app[bot]' &&
       (github.event.deployment.environment == 'casa-digital / staging' ||
        github.event.deployment.environment == 'casa-digital / production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Usa las herramientas de esta versión del workflow, incluso al revisar un SHA anterior.
          ref: ${{ github.workflow_sha }}
      # ADR-141: el smoke corre con el Node pelado (type-stripping nativo), sin instalar nada.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: deployment
        name: Verificar origen, entorno y SHA del deployment
        run: node scripts/ci/run.mjs smoke-context
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Comprobar la entrega por HTTP
        if: steps.deployment.outputs.shouldRun == 'true'
        run: |
          npm run smoke -- --base "$SMOKE_BASE" --expected-sha "$SMOKE_SHA" \
            --indexing "$SMOKE_INDEXING" --bucket-origin "$SMOKE_BUCKET" \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
        env:
          SMOKE_BASE: ${{ steps.deployment.outputs.base }}
          SMOKE_SHA: ${{ steps.deployment.outputs.sha }}
          SMOKE_INDEXING: ${{ steps.deployment.outputs.indexing }}
          SMOKE_BUCKET: ${{ steps.deployment.outputs.bucketOrigin }}
      - name: Conservar resultado en el resumen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/smoke.log" ]; then
            cat "$RUNNER_TEMP/smoke.log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.deployment.outputs.shouldRun == 'true'
        with:
          name: smoke-${{ steps.deployment.outputs.sha }}
          path: ${{ runner.temp }}/smoke.log
          retention-days: 14
